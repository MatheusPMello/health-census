<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Health Analysis Data</title>
  <link rel="stylesheet" href="./health_analysis.css">
</head>
<body>
  <nav>
    <h1>Health Analysis Census</h1>
    <ul>
      <li><a href="./index.html" id="home">Home</a></li>
      <li><a href="./health_contact.html" id="contact">Contact Us</a></li>
    </ul>
  </nav>

  <main class="container container-narrow">
    <section class="glass-panel text-center">
      <h2 class="text-2xl mt-0 text-gradient">Contact Us</h2>
      <p class="mb-2">Feel free to contact us to know more about your conditions and for treatment methods.</p>

      <form id="contactForm" class="text-left">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email address" required>
        </div>
        <div class="form-group">
          <label for="condition">Condition</label>
          <input type="text" id="condition" name="condition" placeholder="E.g. Diabetes, Thyroid..." required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
        </div>
        <button type="button" id="btnSubmitContact" style="width: 100%;">Submit Inquiry</button>
      </form>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnSubmitContact').addEventListener('click', () => {
        const form = document.getElementById('contactForm');
        if (form.checkValidity()) {
          alert('Thank you for contacting us! We will get back to you soon.');
          form.reset();
        } else {
          form.reportValidity();
        }
      });
    });
  </script>
</body>
</html>
